name: Build Android APK from React + Vite

# Run this workflow on every push to main (or adjust branch)
on:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout the code from GitHub
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Install Node.js (v20+)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # 3️⃣ Install npm dependencies
    - name: Install dependencies
      run: npm install

    # 4️⃣ Build your React + Vite project
    - name: Build React app
      run: npm run build

    # 5️⃣ Install Java JDK and Android SDK
    - name: Setup Android SDK
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip wget
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        yes | $HOME/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    # 6️⃣ Install Capacitor in the cloud environment
    - name: Install Capacitor
      run: npm install @capacitor/cli @capacitor/android

    # 7️⃣ Add Android platform and copy web build
    - name: Setup Capacitor Android
      run: |
        npx cap add android || echo "Android platform already exists"
        npx cap copy android

    # 8️⃣ Build the APK using Gradle
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug

    # 9️⃣ Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
