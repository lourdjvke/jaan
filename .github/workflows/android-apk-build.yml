name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite app
        run: npm run build

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # No Gradle cache to avoid missing file errors

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Install Capacitor CLI and Android platform
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --save-dev

      - name: Ensure npx sees local modules
        run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

      - name: Add Android Platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK (force Java 17)
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
          ORG_GRADLE_JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          cd android
          ./gradlew assembleDebug \
            -Dorg.gradle.java.home=$ORG_GRADLE_JAVA_HOME \
            -Pandroid.compileOptions.sourceCompatibility=17 \
            -Pandroid.compileOptions.targetCompatibility=17 \
            -Pkotlin.jvmTarget=17

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

