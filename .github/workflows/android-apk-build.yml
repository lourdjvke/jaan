name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install npm dependencies
        run: npm install

      # 4️⃣ Build Vite / React app
      - name: Build web app
        run: npm run build

      # 5️⃣ Setup Java (important: Java 17, not 21)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6️⃣ Install Capacitor CLI
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7️⃣ Ensure Capacitor config exists
      - name: Ensure capacitor.config.json
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "JaanApp" "com.lourdjxke.jaan" --web-dir=dist
          fi

      # 8️⃣ Add Android platform & copy assets
      - name: Add Android platform
        run: |
          npx cap add android || echo "Android already added"
          npx cap copy android

      # 9️⃣ Build APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 🔟 Upload APK artifact (v4 – not deprecated)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
