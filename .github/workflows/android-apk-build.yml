name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (NO cache to avoid lockfile errors)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install npm dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build React / Vite app
      - name: Build web app
        run: npm run build

      # 5️⃣ Setup Java 17 (NOT 21)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6️⃣ Install Capacitor packages
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7️⃣ Initialize Capacitor (runner is always fresh)
      - name: Initialize Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "JaanApp" "com.lourdjxke.jaan" --web-dir=dist
          fi

      # 8️⃣ Add Android platform and copy web assets
      - name: Setup Android platform
        run: |
          npx cap add android || echo "Android already added"
          npx cap copy android

      # 9️⃣ FORCE Gradle to use Java 17 (kills source release 21 error)
      - name: Force Java 17 for Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      # 🔟 Build debug APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 1️⃣1️⃣ Upload APK (non-deprecated)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
